<div class="w-full flex flex-col sm:flex-row justify-center items-center gap-2 md:gap-4">

    <app-album-cover [albumCover]="albumCover"></app-album-cover>

    <div class="flex flex-col items-center justify-center">
        <p class="w-full text-lg md:text-xl text-center text-shadow-3d font-bold py-2 md:pt-0 mb-1"
            [textContent]="instrText ? 'Escucha el fragmento y adivina el título' : 'Vuelve a escuchar el fragmento'">
        </p>

        <div class="w-full flex flex-col items-center">
            <div class="w-full flex justify-center items-center flex-nowrap">
                <audio #audioPlayer [src]="preview" (ended)="onPreviewEnded()"></audio>

                <button class="w-auto md:w-[130px] h-12 flex items-center justify-center gap-3 bg-[var(--cherry-rose)] hover:bg-[var(--dark-raspberry)] text-sm md:text-base font-medium py-3 px-4 border-b-4 border-[var(--night)] hover:border-white rounded-l-lg cursor-pointer transition-all duration-200 disabled:bg-[var(--dolphin-navy)] hover:disabled:bg-[var(--dolphin-navy)] hover:disabled:border-[var(--night)] disabled:text-[var(--dark-silver)] disabled:cursor-not-allowed"
                    (click)="togglePlay()" [disabled]="!hasPreview || hasPreviewError" [title]="hasPreview ? 'Reproducir' : 'No disponible'" (mouseenter)="mouseEnter = true" (mouseleave)="mouseEnter = false">
                        <i class="fa-solid one-time-animation text-xs" [ngClass]="{ 'fa-pause': isPlaying, 'fa-play': !isPlaying, 'fa-shake': mouseEnter }"></i>
                        {{ isPlaying ? 'Pausar' : 'Escuchar' }}
                </button>

                <div class="flex items-center justify-center gap-px h-12 bg-white border-b-4 border-[var(--night)] rounded-r-lg px-3">
                    @for (_ of [1, 2, 3, 4, 5]; track $index) {
                        <img class="h-[14px] md:h-[18px] filter brightness-0" [class.audio-wave-extra]="$index > 2" [class.animate-audio-wave]="isPlaying" [style.animation-delay.ms]="$index * 120" src="/audio-code.svg" alt="" loading="eager">
                    }
                </div>
            </div>

            <span class="w-full flex justify-center items-center gap-3 mb-3 mt-3 text-xs text-[var(--glossy-grey)] font-medium tracking-wider" [ngClass]="!hasPreviewError ? 'hidden' : 'flex'">
                <i class="fa-solid fa-triangle-exclamation text-xs"></i>Preview no disponible
            </span>
        </div>
    </div>
</div>
