<!-- <div class="flex flex-row items-center justify-between gap-2 text-white border-b-2 border-dashed mb-2 mt-3 sm:mt-0 pb-2">  -->
<div class="flex flex-row items-center justify-between gap-2 text-white border-b-2 border-dashed mb-2 mt-2 sm:mt-0 pt-1 pb-3">
    <span class="flex-1 text-xs/6 md:text-sm/6 text-left tracking-wide md:whitespace-nowrap">
        <i class="fa-solid {{ lyricsMessage.icon }} mr-2"></i>{{ lyricsMessage.text }}
    </span>

    <button type="button" class="shrink-0 flex items-center gap-2 bg-[var(--cherry-rose)] hover:bg-[var(--dark-raspberry)] text-sm font-medium py-3 px-4 border-b-4 border-[var(--night)] hover:border-white rounded-lg cursor-pointer transition-all duration-200 disabled:bg-[var(--dolphin-navy)] hover:disabled:bg-[var(--dolphin-navy)] hover:disabled:border-[var(--night)] disabled:text-[var(--dark-silver)] disabled:cursor-not-allowed"
        [disabled]="isLoadingLyrics || !isLyricsAvailable || hasViewedLyrics" (click)="openModal()" title="Ver pista" (mouseenter)="mouseEnter = true" (mouseleave)="mouseEnter = false">
            <i class="fa-lightbulb one-time-animation" [ngClass]="mouseEnter ? 'fa-solid fa-jello' : 'fa-regular'"></i>Pista  
    </button>
</div>
