<div class="flex flex-row items-center justify-end gap-4 text-white border-b-2 border-dashed my-2 pb-2">  
    <span class="text-xs/6 text-left tracking-wide md:whitespace-nowrap md:px-2">
        <i class="fa-solid {{ lyricsMessage.icon }} mr-2"></i>{{ lyricsMessage.text }}
    </span>

    <button type="button" class="flex items-center gap-2 bg-[var(--cherry-rose)] hover:bg-[var(--dark-raspberry)] text-xs md:text-sm font-medium py-3 px-4 border-b-4 border-[var(--night)] hover:border-white rounded-lg cursor-pointer transition-all duration-200 disabled:bg-[var(--dolphin-navy)] hover:disabled:bg-[var(--dolphin-navy)] hover:disabled:border-[var(--night)] disabled:text-[var(--dark-silver)] disabled:cursor-not-allowed"
        [disabled]="isLoadingLyrics || !isLyricsAvailable || hasViewedLyrics" (click)="openModal()" title="Ver pista" (mouseenter)="mouseEnter = true" (mouseleave)="mouseEnter = false">
            <i class="fa-solid fa-lightbulb one-time-animation text-xs" [ngClass]="mouseEnter ? 'fa-shake' : ''"></i>Pista  
    </button>
</div>
